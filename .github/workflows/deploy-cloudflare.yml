# Despliega el sitio como un Worker en workers.dev. Cuando el cliente tenga
# dominio propio: añadir "routes" en wrangler.jsonc con custom_domain y, si se
# quiere, actualizar SITE_URL abajo al dominio real.
name: Deploy site to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: site-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Servido desde la raíz del Worker, sin BASE_PATH.
      # TODO: cambiar a la URL definitiva en cuanto exista dominio propio.
      - run: npm run build
        env:
          SITE_URL: https://clinica-conecta.workers.dev
          BASE_PATH: /

      # Misma versión que en local: la del lockfile.
      - id: wrangler
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/wrangler'].version")" >> "$GITHUB_OUTPUT"

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ steps.wrangler.outputs.version }}
