# Despliega el sitio como un Worker en juanriccardiconecta.com, el dominio que
# eligió el cliente. La ruta con custom_domain está en wrangler.jsonc.
name: Deploy site to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: site-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Servido desde la raíz del Worker, sin BASE_PATH. SITE_URL es lo que
      # acaba en canonical, en las etiquetas Open Graph y en el sitemap, así
      # que apunta al dominio propio aunque workers.dev siga respondiendo.
      - run: npm run build
        env:
          SITE_URL: https://juanriccardiconecta.com
          BASE_PATH: /

      # Misma versión que en local: la del lockfile.
      - id: wrangler
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/wrangler'].version")" >> "$GITHUB_OUTPUT"

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ steps.wrangler.outputs.version }}
