name: CI

# Los dos workflows de despliegue solo se disparan en develop y main, así que
# esto corre en cualquier otra rama y en cada pull request para detectar un
# build roto antes de llegar a esas ramas.
on:
  pull_request:
  push:
    branches-ignore: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Formato
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run check

      # Con el base path de GitHub Pages, que es el que de verdad ejercita
      # withBase() en los enlaces internos.
      - name: Build
        run: npm run build
        env:
          SITE_URL: https://flopez-dev.github.io
          BASE_PATH: /clinica_conecta/

      - name: Instalar navegador de Playwright
        run: npx playwright install --with-deps chromium

      # test:e2e vuelve a construir (mismo comando que el paso Build, con los
      # mismos env — los defaults de astro.config.mjs ya coinciden, pero se
      # fijan explícitos para no depender de que sigan coincidiendo) y
      # levanta/para el preview server de Astro alrededor de los tests.
      - name: Tests e2e
        run: npm run test:e2e
        env:
          SITE_URL: https://flopez-dev.github.io
          BASE_PATH: /clinica_conecta/
